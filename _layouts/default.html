<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background: #000;
      color: #e0e0e0;
      font-family: 'Times New Roman', serif;
      max-width: 640px;
      margin: 0 auto;
      padding: 2rem 1.2rem;
      line-height: 1.7;
    }
    h1 { font-size: 2.2rem; margin-bottom: 0.3rem; letter-spacing: -1.0em; }
    h1.site-title a { color: #e0e0e0; text-decoration: none; }
    a { color: #e0e0e0; }
    ul { list-style: none; padding: 0; }
    li { margin-bottom: 1.1rem; }
    .date { color: #777; font-size: 0.85rem; display: block; }
    .post-title { font-size: 1.1rem; }
  </style>
</head>
<body>
  <h1 class="site-title"><a href="{{ "/" | relative_url }}">{{ site.title }}</a></h1>
  {{ content }}
</body>
</html>
